<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Puter Test</title>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; padding:20px;">
  <h2>Puter Image Generation Test</h2>
  <div id="status">Starting generation...</div>
  <div id="result"></div>
  <script>
    async function test() {
      const statusEl = document.getElementById('status');
      try {
        statusEl.textContent = 'Calling puter.ai.txt2img...';
        const img = await puter.ai.txt2img("portrait of elderly Indonesian Dayak woodcarver, realistic documentary photo");
        statusEl.textContent = 'Success! Image loaded.';
        document.getElementById('result').appendChild(img);
        console.log('IMG src:', img.src.substring(0, 100));
        // Save to window
        window.generatedImgSrc = img.src;
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        console.error('Error:', err);
      }
    }
    test();
  </script>
</body>
</html>
