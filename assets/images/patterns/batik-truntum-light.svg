<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <style>
      .t-petal { fill: none; stroke: #8A6832; stroke-width: 1.1; stroke-linecap: round; }
      .t-center { fill: #A8512F; }
      .t-stamen { fill: #8A6832; }
      .t-star { fill: #C9A567; opacity: 0.6; }
    </style>
  </defs>
  <g>
    <!-- Central Rosette at (30,30) -->
    <g transform="translate(30,30)">
      <!-- 8-petals -->
      <circle class="t-petal" cx="0" cy="-10" r="4.5" />
      <circle class="t-petal" cx="7" cy="-7" r="4.5" />
      <circle class="t-petal" cx="10" cy="0" r="4.5" />
      <circle class="t-petal" cx="7" cy="7" r="4.5" />
      <circle class="t-petal" cx="0" cy="10" r="4.5" />
      <circle class="t-petal" cx="-7" cy="7" r="4.5" />
      <circle class="t-petal" cx="-10" cy="0" r="4.5" />
      <circle class="t-petal" cx="-7" cy="-7" r="4.5" />
      
      <!-- Central core -->
      <circle class="t-center" cx="0" cy="0" r="3.2" />
      <circle class="t-stamen" cx="0" cy="0" r="1.5" />
    </g>

    <!-- 4 Corner Rosette Petals for seamless tile -->
    <!-- (0,0) -->
    <g transform="translate(0,0)">
      <circle class="t-petal" cx="0" cy="-10" r="4.5" />
      <circle class="t-petal" cx="7" cy="-7" r="4.5" />
      <circle class="t-petal" cx="10" cy="0" r="4.5" />
      <circle class="t-petal" cx="7" cy="7" r="4.5" />
      <circle class="t-petal" cx="0" cy="10" r="4.5" />
      <circle class="t-petal" cx="-7" cy="7" r="4.5" />
      <circle class="t-petal" cx="-10" cy="0" r="4.5" />
      <circle class="t-petal" cx="-7" cy="-7" r="4.5" />
      <circle class="t-center" cx="0" cy="0" r="3.2" />
    </g>
    <!-- (60,0) -->
    <g transform="translate(60,0)">
      <circle class="t-petal" cx="0" cy="-10" r="4.5" />
      <circle class="t-petal" cx="7" cy="-7" r="4.5" />
      <circle class="t-petal" cx="10" cy="0" r="4.5" />
      <circle class="t-petal" cx="7" cy="7" r="4.5" />
      <circle class="t-petal" cx="0" cy="10" r="4.5" />
      <circle class="t-petal" cx="-7" cy="7" r="4.5" />
      <circle class="t-petal" cx="-10" cy="0" r="4.5" />
      <circle class="t-petal" cx="-7" cy="-7" r="4.5" />
      <circle class="t-center" cx="0" cy="0" r="3.2" />
    </g>
    <!-- (0,60) -->
    <g transform="translate(0,60)">
      <circle class="t-petal" cx="0" cy="-10" r="4.5" />
      <circle class="t-petal" cx="7" cy="-7" r="4.5" />
      <circle class="t-petal" cx="10" cy="0" r="4.5" />
      <circle class="t-petal" cx="7" cy="7" r="4.5" />
      <circle class="t-petal" cx="0" cy="10" r="4.5" />
      <circle class="t-petal" cx="-7" cy="7" r="4.5" />
      <circle class="t-petal" cx="-10" cy="0" r="4.5" />
      <circle class="t-petal" cx="-7" cy="-7" r="4.5" />
      <circle class="t-center" cx="0" cy="0" r="3.2" />
    </g>
    <!-- (60,60) -->
    <g transform="translate(60,60)">
      <circle class="t-petal" cx="0" cy="-10" r="4.5" />
      <circle class="t-petal" cx="7" cy="-7" r="4.5" />
      <circle class="t-petal" cx="10" cy="0" r="4.5" />
      <circle class="t-petal" cx="7" cy="7" r="4.5" />
      <circle class="t-petal" cx="0" cy="10" r="4.5" />
      <circle class="t-petal" cx="-7" cy="7" r="4.5" />
      <circle class="t-petal" cx="-10" cy="0" r="4.5" />
      <circle class="t-petal" cx="-7" cy="-7" r="4.5" />
      <circle class="t-center" cx="0" cy="0" r="3.2" />
    </g>

    <!-- Intermediate diamond stars (Cecek bintang) -->
    <polygon class="t-star" points="15,13 17,15 15,17 13,15" />
    <polygon class="t-star" points="45,13 47,15 45,17 43,15" />
    <polygon class="t-star" points="15,43 17,45 15,47 13,45" />
    <polygon class="t-star" points="45,43 47,45 45,47 43,45" />
  </g>
</svg>
